worker_processes auto;
events { worker_connections 1024; }
http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;
  sendfile on;
  keepalive_timeout 65;
  gzip on;
  gzip_min_length 1024;
  gzip_types text/plain text/css application/json application/javascript text/javascript image/svg+xml;
  server_tokens off;

  server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    # The reset link carries its token in the URL fragment; never leak URLs.
    add_header Referrer-Policy "no-referrer" always;

    # Federation metadata must always be fresh and readable by the shell.
    location = /remoteEntry.json {
      add_header Access-Control-Allow-Origin "*" always;
      add_header Cache-Control "no-cache, no-store, must-revalidate" always;
    }

    location ~* \.(js|css|woff2?|svg|png|jpg|jpeg|webp|ico)$ {
      expires 1y;
      add_header Access-Control-Allow-Origin "*" always;
      add_header Cache-Control "public, immutable";
    }

    location / {
      add_header Cache-Control "no-cache" always;
      try_files $uri $uri/ /index.html;
    }
  }
}
